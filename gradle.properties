org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 schaltet R8 auf strenge Keep-Regeln: ein `-keep class X` ohne
# Mitglieder haelt den leeren Konstruktor nicht mehr. Die Regeln der
# Bibliotheken (Room `-keep class * extends RoomDatabase`, WorkManager
# InputMerger, Glance ActionCallback, Firebase ComponentRegistrar) sind so
# geschrieben; 2.0.36 starb deshalb schon beim Start an
# "Failed to create an instance of androidx.work.impl.WorkDatabase".
# false = Verhalten wie AGP 8. Erst entfernen, wenn ein Release-Bau im
# Emulator startet.
android.r8.strictFullModeForKeepRules=false
